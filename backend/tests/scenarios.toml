# Каждый тест помечен @pytest.mark.case(id=...) и закрывает ровно один сценарий.
# Тест обязан лежать в tests/<layer>/<domain>/. status = "known_bug" превращает
# тест в xfail(strict=True) — с обязательным reason.
schema_version = 1

# --- unit / config ---

[[scenario]]
id = "CONFIG-001"
title = "Приложение не стартует без обязательных настроек и называет каждую незаполненную"
layer = "unit"
domain = "config"


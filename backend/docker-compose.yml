name: labka-backend

services:
  migrate:
    build: .
    image: labka_backend:latest
    container_name: labka_migrate
    restart: "no"
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    volumes:
      - ./config.toml:/app/config.toml:ro

  backend:
    build: .
    image: labka_backend:latest
    container_name: labka_backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "127.0.0.1:8000:8000"

networks:
  default:
    name: labka
    external: true
